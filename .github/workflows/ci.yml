name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # npm test builds dist/ first: the CLI tests run the built bundle.
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test --manifest-path backend/Cargo.toml --locked --workspace
      # Check the production feature set separately; test fixtures are not shipped.
      - run: cargo build --manifest-path backend/Cargo.toml --locked -p maestro-cli

  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/workers/langgraph/requirements.lock
      - run: python -m pip install -r backend/workers/langgraph/requirements.lock playwright==1.58.0
      - run: python -m unittest discover -s backend/workers/langgraph -p 'test_*.py'
      - run: python -m unittest discover -s backend/workers/browser -p 'test_*.py'
