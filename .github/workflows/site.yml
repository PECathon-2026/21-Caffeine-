name: Site

# Every push to main that touches the page (or the office it runs) rebuilds site/
# and deploys it to theagentoffice.xyz on Cloudflare Workers (wrangler.jsonc).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token from the "Edit
# Cloudflare Workers" template, scoped to this account and the theagentoffice.xyz
# zone) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "src/**"
      - "assets/**"
      - "scripts/build-site.mjs"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site
        env:
          SITE_URL: https://theagentoffice.xyz
      - run: npx --yes wrangler@4.151.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
