[package]
name = "maestro-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
maestro-types = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
# Crate-local: RFC 7231 http-date parsing for Retry-After headers.
httpdate = "1"

[features]
test-support = ["maestro-types/test-support"]

[dev-dependencies]
maestro-types = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
