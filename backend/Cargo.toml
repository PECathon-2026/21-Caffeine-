[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/PECathon-2026/21-Caffeine-"

[workspace.dependencies]
maestro-types = { path = "crates/maestro-types" }
maestro-store = { path = "crates/maestro-store" }
maestro-providers = { path = "crates/maestro-providers" }
maestro-engine = { path = "crates/maestro-engine" }
maestro-daemon = { path = "crates/maestro-daemon" }
maestro-tui = { path = "crates/maestro-tui" }

tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2"] }
axum = { version = "0.8", features = ["json"] }
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
globset = "0.4"
futures = "0.3"
async-trait = "0.1"
bytes = "1"
tokio-util = "0.7"
toml = "0.9"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
